<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Clicker</h1>
    <div class="form-group">
      <label>URL:</label>
      <input type="text" id="urlInput" placeholder="https://example.com">
    </div>
    <div class="form-group">
      <label>Selector:</label>
      <input type="text" id="selectorInput" placeholder="#button, .click-me">
    </div>
    <button id="saveBtn">Save</button>
    <button id="clickBtn">Click Now</button>
    <button id="toggleBtn" class="toggle">Disable</button>
    <div id="status" class="status"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
